[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "loan-dq"
version = "0.1.0"
description = "Deterministic data-quality and anomaly-detection pipeline for lender loan tapes"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]
parquet = ["pyarrow>=15,<22"]
aws = [
    "boto3>=1.34,<2",
]
infra = [
    "aws-cdk-lib==2.150.0",
    "constructs==10.3.0",
]

[project.scripts]
loan-dq = "loan_dq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loan_dq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
# No python_version pin: mypy targets the interpreter it runs under. numpy >= 2.5 ships PEP 695
# `type` statements in its stubs, which mypy rejects when told to target < 3.12.
strict = true
mypy_path = "src"
packages = ["loan_dq"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[dependency-groups]
build = [
    "hatchling==1.27.0",
]

[tool.uv]
exclude-newer = "2026-09-02T00:00:00Z"
